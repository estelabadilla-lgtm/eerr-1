<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comisiones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f3; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#1c5cab; --bar:#2a78d6; --bar-soft:#9ec5f4;
  --crit:#d03b3b; --crit-bg:#fbe9e9; --crit-ink:#a32020;
  --good:#0ca30c; --good-bg:#e6f4e6; --good-ink:#006300;
  --warn-bg:#fdf1d8; --warn-ink:#8a5a00;
  --hover:rgba(42,120,214,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --accent:#86b6ef; --bar:#3987e5; --bar-soft:#1c5cab;
    --crit:#e66767; --crit-bg:#3a1c1c; --crit-ink:#f19a9a;
    --good:#0ca30c; --good-bg:#16301a; --good-ink:#5fd35f;
    --warn-bg:#3a2e12; --warn-ink:#f2c35a;
    --hover:rgba(57,135,229,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --accent:#86b6ef; --bar:#3987e5; --bar-soft:#1c5cab;
  --crit:#e66767; --crit-bg:#3a1c1c; --crit-ink:#f19a9a;
  --good:#0ca30c; --good-bg:#16301a; --good-ink:#5fd35f;
  --warn-bg:#3a2e12; --warn-ink:#f2c35a;
  --hover:rgba(57,135,229,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
.wrap{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:2px 0 0;font-size:13px}
.asof{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:-4px}
input[type=search],select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
input[type=search]{flex:1 1 160px;min-width:0}
#reset{margin-left:auto;font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px}
button.export{font:inherit;font-size:13px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi-val{font-size:22px;font-weight:700;margin-top:2px}
.kpi-val.neg{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed}
colgroup col.c-fecha{width:9%}
colgroup col.c-tipo{width:9%}
colgroup col.c-pago{width:8%}
colgroup col.c-folio{width:7%}
colgroup col.c-rut{width:10%}
colgroup col.c-razon{width:20%}
colgroup col.c-vendedor{width:13%}
colgroup col.c-estado{width:7%}
colgroup col.c-neto{width:9%}
colgroup col.c-iva{width:8%}
colgroup col.c-total{width:7%}
colgroup col.c-comision{width:9%}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{background:var(--surface);font-weight:600;font-size:12px;color:var(--ink2);position:sticky;top:0;z-index:1}
th button{background:none;border:0;font:inherit;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;padding:0;width:100%;text-align:left}
td.razon{white-space:normal;overflow:visible}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.neg{color:var(--crit-ink)}
tr:hover td{background:var(--hover)}
tfoot td{font-weight:700;border-top:2px solid var(--grid);border-bottom:none;background:var(--surface)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:12px;white-space:nowrap}
.badge.bl{background:var(--crit-bg);color:var(--crit-ink)}
.badge.ok{background:var(--good-bg);color:var(--good-ink)}
.badge.pend{background:var(--warn-bg);color:var(--warn-ink)}
.badge.chq{background:#e8f0fe;color:#1a56db}
.badge.parc{background:#fff3e0;color:#e65100}
.badge.reb{background:#f1f5f9;color:#64748b}
.badge.cart{background:#ede7f6;color:#5e35b1}
.badge.cart{background:#ede7f6;color:#5e35b1}
/* dropdown vendedores */
.vdrop{position:relative;display:inline-block}
.vdrop-btn{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 28px 6px 10px;cursor:pointer;white-space:nowrap;min-width:160px;text-align:left;position:relative}
.vdrop-btn::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.vdrop-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;padding:6px 0;max-height:260px;overflow-y:auto}
.vdrop-panel.open{display:block}
.vdrop-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.vdrop-item:hover{background:var(--hover)}
.vdrop-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex-shrink:0}
.msg{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink)}
.msg.err{background:var(--crit-bg);color:var(--crit-ink)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bar-soft);border-top-color:var(--bar);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Comisiones</h1>
      <p class="sub">Facturas emitidas por vendedor · Fuente: SII + Softland</p>
      <p class="asof" id="asof"></p>
    </div>
    <button class="export" onclick="exportar()">Exportar Excel</button>
  </header>

  <div id="msgBox" hidden></div>

  <div class="filters">
    <span class="flabel">Mes</span>
    <select id="fMes"><option value="">Todos los meses</option></select>
    <span class="flabel">Vendedor</span>
    <div class="vdrop" id="vdropWrap">
      <button class="vdrop-btn" id="vdropBtn" type="button">Todos los vendedores</button>
      <div class="vdrop-panel" id="vdropPanel"></div>
    </div>
    <span class="flabel">Pago</span>
    <select id="fPago"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="pagada">Pagada</option><option value="cheque">Cheque</option></select>
    <input type="search" id="fBuscar" placeholder="Buscar RUT, nombre, folio…">
    <button id="reset" onclick="resetFiltros()">Limpiar</button>
  </div>

  <div class="kpis" id="kpis" hidden>
    <div class="kpi"><div class="kpi-label">Facturas neto</div><div class="kpi-val" id="kFacturas">-</div></div>
    <div class="kpi"><div class="kpi-label">NC neto</div><div class="kpi-val neg" id="kNC">-</div></div>
    <div class="kpi"><div class="kpi-label">Neto total</div><div class="kpi-val" id="kNeto">-</div></div>
    <div class="kpi"><div class="kpi-label">Documentos</div><div class="kpi-val" id="kDocs">-</div></div>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table id="tbl">
        <colgroup>
          <col class="c-fecha"><col class="c-tipo"><col class="c-pago"><col class="c-folio">
          <col class="c-rut"><col class="c-razon"><col class="c-vendedor">
          <col class="c-estado"><col class="c-neto"><col class="c-iva"><col class="c-total"><col class="c-comision">
        </colgroup>
        <thead><tr>
          <th><button onclick="sort('fecha')">Fecha</button></th>
          <th><button onclick="sort('tipo')">Tipo</button></th>
          <th><button onclick="sort('estado_pago')">Pago</button></th>
          <th><button onclick="sort('folio')">Folio</button></th>
          <th><button onclick="sort('rut')">RUT</button></th>
          <th><button onclick="sort('razon')">Razón Social</button></th>
          <th><button onclick="sort('vendedor')">Vendedor</button></th>
          <th><button onclick="sort('bloqueado')">Estado</button></th>
          <th style="text-align:right"><button onclick="sort('neto')">Neto</button></th>
          <th style="text-align:right"><button onclick="sort('iva')">IVA</button></th>
          <th style="text-align:right"><button onclick="sort('total')">Total</button></th>
          <th style="text-align:right;background:var(--blue-dim,rgba(0,120,200,.10));color:var(--accent)"><button onclick="sort('comision')" style="color:var(--accent)">Comisión</button></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<script>
// Tasas de comisión por vendedor (% sobre neto). Aliases del mismo vendedor comparten tasa.
const TASAS = {
  'joel cordova':          0.025,
  'chilemat joel cordova': 0.025,
  'diego rivero':          0.05,
  'sandra ortega':         0.05,
  'chilemat sandra':       0.05,
  'oscar bucarey':         0.05,
  'marcelo herrera':       0.025,
  'chilemat marcelo':      0.025,
};
function tasaVendedor(v){ return TASAS[(v||'').toLowerCase().trim()]||0; }

const LS = 'libro_ventas_data';
let ROWS = [];
let VEND = {}; // folio -> vendedor
let filtered = [];
let VENDEDOR_LOCK = null; // null = sin restricción; array = filtrar solo esos vendedores (minúsculas)
let sortCol = 'fecha', sortDir = 1;

const fmt = n => n == null ? '-' : '$' + Math.round(n).toLocaleString('es-CL');
const tipoLabel = t => t==='33'?'FC':t==='34'?'FC Exenta':t==='61'?'NC':t==='56'?'ND':t;
const mesLabel = m => { if(!m)return m; const [y,mo]=m.split('-'); return new Date(+y,+mo-1,1).toLocaleDateString('es-CL',{month:'long',year:'numeric'}); };

function showMsg(txt, tipo=''){
  const el=document.getElementById('msgBox');
  el.className='msg'+(tipo?' '+tipo:'');
  el.textContent=txt;
  el.hidden=!txt;
}

function sort(col){
  if(sortCol===col) sortDir*=-1; else{sortCol=col;sortDir=1;}
  renderTable();
}

function resetFiltros(){
  document.getElementById('fMes').value='';
  document.getElementById('fPago').value='';
  document.querySelectorAll('#vdropPanel input').forEach(cb=>cb.checked=false);
  updateVdropLabel();
  document.getElementById('fBuscar').value='';
  renderTable();
}

function updateVdropLabel(){
  const sel=[...document.querySelectorAll('#vdropPanel input:checked')].map(cb=>cb.value);
  document.getElementById('vdropBtn').textContent=sel.length===0?'Todos los vendedores':sel.length===1?sel[0]:`${sel.length} vendedores`;
}

function getFiltered(){
  const mes=document.getElementById('fMes').value;
  const vendSel=[...document.querySelectorAll('#vdropPanel input:checked')].map(cb=>cb.value);
  const pago=document.getElementById('fPago').value;
  const bus=(document.getElementById('fBuscar').value||'').toLowerCase().trim();
  return ROWS.filter(r=>{
    if(mes && r.mes!==mes) return false;
    if(vendSel.length && !vendSel.includes(r.vendedor||'')) return false;
    const esNC = r.tipo==='61' || r.tipo==='56';
    if(pago && esNC && pago!=='rebaja') return false;
    if(pago && !esNC && r.estado_pago!==pago) return false;
    if(bus && !r.razon.toLowerCase().includes(bus) && !r.rut.includes(bus) && !r.folio.includes(bus)) return false;
    return true;
  });
}

function renderTable(){
  filtered=getFiltered();
  // Sort
  const col=sortCol;
  filtered.sort((a,b)=>{
    let va=a[col]??'', vb=b[col]??'';
    if(col==='neto'||col==='iva'||col==='total'){va=+va||0;vb=+vb||0;}
    if(va<vb)return -sortDir; if(va>vb)return sortDir; return 0;
  });

  // KPIs (NCs restan)
  const factNeto=filtered.filter(r=>r.tipo!=='61').reduce((s,r)=>s+(+r.neto||0),0);
  const ncNeto=filtered.filter(r=>r.tipo==='61').reduce((s,r)=>s+(+r.neto||0),0);
  const totalNeto=factNeto-ncNeto;
  document.getElementById('kFacturas').textContent=fmt(factNeto);
  document.getElementById('kNC').textContent=fmt(-ncNeto);
  document.getElementById('kNeto').textContent=fmt(totalNeto);
  document.getElementById('kDocs').textContent=filtered.length.toLocaleString('es-CL');
  document.getElementById('kpis').hidden=false;

  // Rows
  const tbody=document.getElementById('tbody');
  tbody.innerHTML=filtered.map(r=>{
    const neg=r.tipo==='61';
    const nc=neg?' neg':'';
    return `<tr>
      <td>${r.fecha?r.fecha.split('-').reverse().join('/'):'—'}${r.vencimiento?`<br><span style="font-size:0.72em;color:#94a3b8;white-space:nowrap">Vce ${r.vencimiento.slice(0,10).split('-').reverse().join('/')}</span>`:''}</td>
      <td class="${neg?'neg':''}">${tipoLabel(r.tipo)}</td>
      <td>${(()=>{
        const total=Math.abs(+r.total||0);
        const saldo=+r.saldo_pendiente||0;
        const esNC = r.tipo==='61' || r.tipo==='56';
        const parcial=!esNC && r.estado_pago==='pendiente' && saldo>0.5 && total>0.5 && saldo<total*0.995;
        if(esNC) return '<span class="badge reb">Rebaja</span>';
        if(r.estado_pago==='cartera') return `<span class="badge cart">Cartera</span>${r.vce_cheque?`<br><span style="font-size:0.72em;color:#94a3b8">Vce ${r.vce_cheque.slice(0,10).split('-').reverse().join('/')}</span>`:''}`;
        if(r.estado_pago==='pagada') return '<span class="badge ok">Pagada</span>';
        if(r.estado_pago==='cheque') return '<span class="badge chq">Cheque</span>';
        if(parcial) return `<span class="badge parc">Parcial</span><br><span style="font-size:0.72em;color:#94a3b8">Saldo ${fmt(saldo)}</span>`;
        if(r.estado_pago==='pendiente') return '<span class="badge pend">Pendiente</span>';
        return '—';
      })()}</td>
      <td>${r.folio}</td>
      <td>${r.rut||''}</td>
      <td class="razon">${r.razon||''}</td>
      <td>${r.vendedor||'—'}</td>
      <td>${r.bloqueado==='S'?'<span class="badge bl">Bloqueado</span>':'<span class="badge ok">Vigente</span>'}</td>
      <td class="num${nc}">${fmt(neg?-(+r.neto||0):(+r.neto||0))}</td>
      <td class="num${nc}">${fmt(neg?-(+r.iva||0):(+r.iva||0))}</td>
      <td class="num${nc}">${fmt(neg?-(+r.total||0):(+r.total||0))}</td>
      <td class="num${nc}" style="${r.comision?'background:var(--blue-dim,rgba(0,120,200,.08));color:var(--accent);font-weight:600':'color:var(--muted)'}">${r.comision?fmt(neg?-r.comision:r.comision):'—'}</td>
    </tr>`;
  }).join('');

  // Footer
  const sign=r=>r.tipo==='61'?-1:1;
  const netoSum=filtered.reduce((s,r)=>s+sign(r)*(+r.neto||0),0);
  const ivaSum=filtered.reduce((s,r)=>s+sign(r)*(+r.iva||0),0);
  const totSum=filtered.reduce((s,r)=>s+sign(r)*(+r.total||0),0);
  document.getElementById('tfoot').innerHTML=`<tr>
    <td colspan="6">Total (${filtered.length.toLocaleString('es-CL')} documentos)</td>
    <td colspan="2"></td>
    <td class="num">${fmt(netoSum)}</td>
    <td class="num">${fmt(ivaSum)}</td>
    <td class="num">${fmt(totSum)}</td>
    <td class="num" style="background:var(--blue-dim,rgba(0,120,200,.10));color:var(--accent)">${fmt(filtered.reduce((s,r)=>s+sign(r)*(r.comision||0),0))}</td>
  </tr>`;
}

function populateFiltros(){
  const meses=[...new Set(ROWS.map(r=>r.mes))].sort();
  const selMes=document.getElementById('fMes');
  meses.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=mesLabel(m);selMes.appendChild(o);});

  const vends=[...new Set(ROWS.map(r=>r.vendedor||'').filter(Boolean))].sort();
  const panel=document.getElementById('vdropPanel');
  panel.innerHTML=vends.map(v=>`<label class="vdrop-item"><input type="checkbox" value="${v.replace(/"/g,'&quot;')}"><span>${v}</span></label>`).join('');
  panel.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{updateVdropLabel();renderTable();}));
  // toggle panel
  document.getElementById('vdropBtn').addEventListener('click',e=>{e.stopPropagation();panel.classList.toggle('open');});
  document.addEventListener('click',()=>panel.classList.remove('open'));
}

function exportar(){
  if(!filtered.length)return;
  const wb=XLSX.utils.book_new();
  const data=[['Fecha','Tipo','Folio','RUT','Razón Social','Vendedor','Neto','IVA','Total'],...filtered.map(r=>[
    r.fecha?r.fecha.split('-').reverse().join('/'):''
    ,tipoLabel(r.tipo),r.folio,r.rut,r.razon,r.vendedor||''
    ,+r.neto||0,+r.iva||0,+r.total||0
  ])];
  const ws=XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb,ws,'Comisiones');
  XLSX.writeFile(wb,'Comisiones.xlsx');
}

// Listeners
document.getElementById('fMes').addEventListener('change',renderTable);
// vendedor: manejado por checkboxes en populateFiltros
document.getElementById('fPago').addEventListener('change',renderTable);
document.getElementById('fBuscar').addEventListener('input',renderTable);

(async()=>{
  // ── Auth guard: si viene de portal vendedores, verificar token ──────────────
  const _vtoken = localStorage.getItem('vtoken');
  if (_vtoken) {
    try {
      const _vr = await fetch('/api/verify?token=' + encodeURIComponent(_vtoken));
      if (!_vr.ok) throw new Error();
      const _vp = await _vr.json();
      if (!(_vp.tabs||[]).includes('comisiones')) {
        window.location.href = '/vendedores.html'; return;
      }
      if (_vp.vendedores) {
        VENDEDOR_LOCK = _vp.vendedores; // array de nombres en minúsculas
        // Ocultar selector de vendedor y mostrar nombre bloqueado
        const vdrop = document.getElementById('vdropBtn')?.closest('span, div, label')?.parentElement;
        const btn = document.getElementById('vdropBtn');
        if (btn) {
          btn.textContent = _vp.vendedores.map(v=>v.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')).join(' / ');
          btn.style.pointerEvents = 'none';
          btn.style.opacity = '.6';
        }
        // Botón cerrar sesión
        const hdr = document.querySelector('header');
        if (hdr) {
          const logBtn = document.createElement('button');
          logBtn.textContent = 'Cerrar sesión';
          logBtn.style.cssText = 'font:inherit;font-size:12px;background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--muted);cursor:pointer';
          logBtn.onclick = () => { localStorage.removeItem('vtoken'); window.location.href='/vendedores.html'; };
          hdr.appendChild(logBtn);
        }
      }
    } catch {
      localStorage.removeItem('vtoken');
      window.location.href = '/vendedores.html'; return;
    }
  }
  // ────────────────────────────────────────────────────────────────────────────

  showMsg('⏳ Cargando datos…');

  // 1) Cargar libro de ventas (igual que libro_ventas.html)
  try{
    const r=await fetch('data_ventas.json',{cache:'no-store'});
    if(r.ok) ROWS=await r.json();
  }catch(e){}

  // Aplicar actualizaciones de localStorage (misma lógica que libro_ventas)
  try{
    const upd=JSON.parse(localStorage.getItem(LS+'_upd')||'null');
    if(upd&&Array.isArray(upd)&&upd.length){
      const mesesUpd=new Set(upd.map(r=>r.mes));
      const mesesAReemplazar=new Set();
      for(const mes of mesesUpd){
        const maxUpd=(upd.filter(r=>r.mes===mes).map(r=>r.fecha).filter(Boolean).sort().pop()||'');
        const maxSrv=(ROWS.filter(r=>r.mes===mes).map(r=>r.fecha).filter(Boolean).sort().pop()||'');
        if(maxUpd>maxSrv) mesesAReemplazar.add(mes);
      }
      if(mesesAReemplazar.size>0)
        ROWS=ROWS.filter(r=>!mesesAReemplazar.has(r.mes)).concat(upd.filter(r=>mesesAReemplazar.has(r.mes)));
    }
  }catch(e){}

  // Filtrar solo desde dic 2025
  ROWS=ROWS.filter(r=>r.mes>='2025-12');

  // 2) Cargar vendedores + cheques en cartera en paralelo
  const CARTERA = {}; // folio -> vce_ch
  try{
    const [rv, rc] = await Promise.all([
      fetch('/api/vendedores_facturas'),
      fetch('/api/cheques_cartera'),
    ]);
    if(rv.ok){ const d=await rv.json(); if(d.filas) d.filas.forEach(f=>{ VEND[String(f.folio)]={vendedor:f.vendedor, bloqueado:f.bloqueado, estado_pago:f.estado_pago, vencimiento:f.vencimiento, saldo_pendiente:f.saldo_pendiente}; }); }
    if(rc.ok){ const d=await rc.json(); if(d.filas) d.filas.forEach(f=>{ CARTERA[String(f.folio)]=f.vce_ch||''; }); }
  }catch(e){}

  // Enriquecer ROWS con vendedor
  ROWS=ROWS.map(r=>{
    const vend=VEND[r.folio]?.vendedor||'';
    const tasa=tasaVendedor(vend);
    const comision=tasa ? Math.round((+r.neto||0)*tasa) : 0;
    let estado_pago=VEND[r.folio]?.estado_pago||'';
    const vce_cheque=CARTERA[r.folio]||'';
    if(estado_pago==='pagada' && vce_cheque) estado_pago='cartera';
    return {...r, vendedor:vend, bloqueado:(VEND[r.folio]?.bloqueado||'N'), estado_pago, vencimiento:(VEND[r.folio]?.vencimiento||''), saldo_pendiente:(VEND[r.folio]?.saldo_pendiente??999999), vce_cheque, comision};
  });

  // Filtrar por vendedor si hay lock (perfil vendedor)
  if (VENDEDOR_LOCK) {
    ROWS = ROWS.filter(r => VENDEDOR_LOCK.includes((r.vendedor||'').toLowerCase().trim()));
  }

  // Timestamp
  try{
    const fechas=ROWS.map(r=>r.fecha).filter(Boolean).sort();
    const ultima=fechas[fechas.length-1];
    if(ultima){
      const ts=new Date(ultima+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
      document.getElementById('asof').textContent='Últ. documento: '+ts;
    }
  }catch(e){}

  if(!ROWS.length){
    showMsg('No hay datos cargados.','err');
    return;
  }

  showMsg('');
  populateFiltros();
  renderTable();
})();
</script>
</body>
