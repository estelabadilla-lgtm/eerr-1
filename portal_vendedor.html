<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grantt · Portal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;background:#0f172a;font-family:'Segoe UI',system-ui,sans-serif;padding:24px}
  h1{color:#38bdf8;font-size:1.4rem;font-weight:700;margin-bottom:8px;text-align:center}
  .sub{color:#64748b;font-size:.85rem;margin-bottom:36px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;width:100%;max-width:700px}
  a.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
          padding:28px 20px;background:#1e293b;border:1px solid #334155;border-radius:14px;
          color:#f1f5f9;text-decoration:none;font-weight:600;font-size:.95rem;transition:.2s}
  a.card:hover{border-color:#38bdf8;background:#1e3a5f;color:#38bdf8}
  .icon{font-size:2rem}
  .logout{margin-top:32px;color:#64748b;font-size:.8rem;cursor:pointer;background:none;
           border:none;padding:4px 8px}
  .logout:hover{color:#f87171}
</style>
</head>
<body>
<h1 id="greeting">Bienvenida</h1>
<p class="sub">Selecciona la sección que deseas ver</p>
<div class="grid" id="grid"></div>
<button class="logout" id="logoutBtn">Cerrar sesión</button>

<script>
const TAB_INFO = {
  vehiculos:   { label: 'Vehículos',   icon: '🚗', href: '/vehiculos.html' },
  vencidos:    { label: 'Vencidos',    icon: '📋', href: '/cartera_vencidos.html' },
  nv_retail:   { label: 'NV Retail',   icon: '🏪', href: '/nv_retail.html' },
  comisiones:  { label: 'Comisiones',  icon: '💰', href: '/comisiones.html' },
};

(async () => {
  const t = localStorage.getItem('vtoken');
  if (!t) { window.location.href = '/vendedores.html'; return; }

  let profile;
  try {
    const r = await fetch('/api/verify?token=' + encodeURIComponent(t));
    if (!r.ok) throw new Error();
    profile = await r.json();
  } catch {
    localStorage.removeItem('vtoken');
    window.location.href = '/vendedores.html';
    return;
  }

  document.getElementById('greeting').textContent =
    'Bienvenida, ' + profile.user.charAt(0).toUpperCase() + profile.user.slice(1);

  const grid = document.getElementById('grid');
  (profile.tabs || []).forEach(tab => {
    const info = TAB_INFO[tab];
    if (!info) return;
    const a = document.createElement('a');
    a.className = 'card';
    a.href = info.href;
    a.innerHTML = `<span class="icon">${info.icon}</span>${info.label}`;
    grid.appendChild(a);
  });
})();

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('vtoken');
  localStorage.removeItem('vtabs');
  localStorage.removeItem('vvendedores');
  window.location.href = '/vendedores.html';
});
</script>
</body>
</html>
