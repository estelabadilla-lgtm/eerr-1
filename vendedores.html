<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grantt · Acceso Vendedores</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f172a;font-family:'Segoe UI',system-ui,sans-serif}
  .card{background:#1e293b;border:1px solid #334155;border-radius:16px;
        padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px #0008}
  .logo{text-align:center;margin-bottom:28px}
  .logo img{height:48px}
  .logo-text{color:#38bdf8;font-size:1.5rem;font-weight:700;letter-spacing:.5px}
  .logo-sub{color:#64748b;font-size:.82rem;margin-top:4px}
  label{display:block;color:#94a3b8;font-size:.8rem;font-weight:600;
        letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
  input{width:100%;padding:11px 14px;background:#0f172a;border:1px solid #334155;
        border-radius:8px;color:#f1f5f9;font-size:.95rem;outline:none;transition:.2s}
  input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px #38bdf820}
  .field{margin-bottom:20px}
  button{width:100%;padding:13px;background:#0ea5e9;border:none;border-radius:8px;
         color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px}
  button:hover{background:#38bdf8}
  button:disabled{background:#334155;color:#64748b;cursor:not-allowed}
  .error{color:#f87171;font-size:.85rem;margin-top:14px;text-align:center;
         background:#450a0a30;border:1px solid #7f1d1d50;border-radius:6px;
         padding:8px 12px;display:none}
  .error.show{display:block}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff4;
            border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
            vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-text">GRANTT</div>
    <div class="logo-sub">Portal de Vendedores</div>
  </div>
  <form id="frm">
    <div class="field">
      <label for="u">Usuario</label>
      <input id="u" type="text" placeholder="Ej: sandra" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">Contraseña</label>
      <input id="p" type="password" autocomplete="current-password" required>
    </div>
    <button id="btn" type="submit">Ingresar</button>
    <div class="error" id="err"></div>
  </form>
</div>
<script>
document.getElementById('frm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.className = 'error';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando…';

  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('u').value.trim(),
        pass: document.getElementById('p').value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error al ingresar');

    localStorage.setItem('vtoken', d.token);
    localStorage.setItem('vtabs',  JSON.stringify(d.tabs));
    localStorage.setItem('vvendedores', JSON.stringify(d.vendedores));

    // Redirigir según perfil
    if (d.tabs.length > 1) {
      // Alejandra u otro con múltiples pestañas → ir al portal principal
      window.location.href = '/portal_vendedor.html';
    } else {
      window.location.href = '/comisiones.html';
    }
  } catch(ex) {
    err.textContent = ex.message;
    err.className = 'error show';
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});

// Si ya tiene sesión válida, redirigir directo
(async () => {
  const t = localStorage.getItem('vtoken');
  if (!t) return;
  try {
    const r = await fetch('/api/verify?token=' + encodeURIComponent(t));
    if (!r.ok) return;
    const d = await r.json();
    if (d.tabs.length > 1) window.location.href = '/portal_vendedor.html';
    else window.location.href = '/comisiones.html';
  } catch {}
})();
</script>
</body>
</html>
